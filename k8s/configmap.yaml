apiVersion: v1
kind: ConfigMap
metadata:
  name: paserlab-config
  namespace: playground
data:
  APP_ENV: "development"
  APP_NAME: "ParseLab"
  DATA_ROOT: "/app/data/dwp_comp/paserlab/storage"
  MAX_UPLOAD_SIZE_MB: "100"
  MAX_CONCURRENT_RUNS: "1"
  CORS_ORIGINS: "https://oasis-dev.agentone.kr,http://localhost:5173,http://localhost:15173"
  COMMAND_ALLOWED_EXECUTABLES: "docling,uv"
  AUTO_CREATE_TABLES: "false"
  PYTHONDONTWRITEBYTECODE: "1"

  # Synap URL은 Parser Connector의 base_url로 등록하고 API Key만 Secret에서 주입한다.

  # PP-StructureV3는 Synap/Fasoo 검증 Pod의 이미지와 메모리를 가볍게 유지하기 위해 끈다.
  PADDLEOCR_ENABLED: "false"
  PADDLEOCR_DEVICE: "cpu"
  PADDLEOCR_MAX_CONCURRENCY: "1"

  # Fasoo는 전용 NAS 하위 디렉터리만 사용한다.
  FASOO_ENABLED: "true"
  FASOO_BASE_URL: "https://intra-dev.agentone.kr:18443"
  FASOO_TIMEOUT_SECONDS: "300"
  FASOO_ARTIFACT_WAIT_SECONDS: "5"
  FASOO_DETECT_PATH: "/piiapi/detect/system/path"
  FASOO_CONFIGURATION_PATH: "/piiapi/configuration"
  NAS_MOUNT_PATH: "/app/data/dwp_comp"
  FASOO_NAS_PATH: "/dwp_comp"
  FASOO_WORK_SUBDIR: "paserlab/fasoo-smoke"
  # 각 Parser의 전처리 완료 산출물(output.txt)을 파수 입력으로 사용한다.
  FASOO_INPUT_TYPE: "TEXT"
  FASOO_MASKING_CHAR: "*"
  FASOO_RULE_VERSION: "1.3"
  FASOO_SYSTEM_CODE: "FASOO"
  FASOO_SYSTEM_NAME: "파수"
  FASOO_PATTERNS: "8352e3cefcf841b8ae8eacbafc9dc2e8,470f4ac178d948f389d848e705306ddd,75a718ffe4d646008c606b0578ad2e78,68502af4bf7d4274997d3698243a7b69"
  FASOO_LABELS: "SS_BRAND,AD_METRO,AD_CITY,AD_ADDRESS,AD_BRAND,AD_DETAIL,AD_POSTAL"
