# Backend Package 메타데이터, 실행 의존성, 품질 도구 설정.
[project]
name = "parselab-backend"
version = "0.1.0"
description = "ParseLab document parser comparison backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "diff-match-patch>=20241021,<20270000",
  "fastapi>=0.116,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
paddleocr-cpu = [
  "paddleocr[doc-parser]>=3.7,<3.8",
  "paddlepaddle>=3.3.1,<3.4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL instance",
  "paddle_integration: downloads and runs real PaddleOCR models",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
