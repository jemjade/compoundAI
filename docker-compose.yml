# PostgreSQL과 Parser 산출물 영속 Volume을 포함한 로컬 ParseLab Stack.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parselab
      POSTGRES_USER: parselab
      POSTGRES_PASSWORD: parselab
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parselab -d parselab"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        INSTALL_PADDLEOCR: ${INSTALL_PADDLEOCR:-false}
    environment:
      DATABASE_URL: postgresql+asyncpg://parselab:parselab@postgres:5432/parselab
      JWT_SECRET: local-docker-secret-change-me-please
      DATA_ROOT: /app/data
      MAX_CONCURRENT_RUNS: 2
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COMMAND_ALLOWED_EXECUTABLES: ${COMMAND_ALLOWED_EXECUTABLES:-docling,uv,docker}
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:-}
      DOCLING_API_KEY: ${DOCLING_API_KEY:-parselab-local-docling}
      MINERU_BASE_URL: ${MINERU_BASE_URL:-}
      SYNAP_API_KEY: ${SYNAP_API_KEY:-}
      PADDLEOCR_ENABLED: ${PADDLEOCR_ENABLED:-false}
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-cpu}
      PADDLEOCR_MAX_CONCURRENCY: ${PADDLEOCR_MAX_CONCURRENCY:-1}
      PADDLEOCR_MODEL_CACHE_DIR: ${PADDLEOCR_MODEL_CACHE_DIR:-/app/models/paddleocr}
      PADDLEOCR_USE_DOC_ORIENTATION: ${PADDLEOCR_USE_DOC_ORIENTATION:-true}
      PADDLEOCR_USE_DOC_UNWARPING: ${PADDLEOCR_USE_DOC_UNWARPING:-true}
      PADDLEOCR_USE_TEXTLINE_ORIENTATION: ${PADDLEOCR_USE_TEXTLINE_ORIENTATION:-true}
      PADDLEOCR_USE_TABLE_RECOGNITION: ${PADDLEOCR_USE_TABLE_RECOGNITION:-true}
      PADDLEOCR_USE_FORMULA_RECOGNITION: ${PADDLEOCR_USE_FORMULA_RECOGNITION:-false}
      PADDLEOCR_USE_CHART_RECOGNITION: ${PADDLEOCR_USE_CHART_RECOGNITION:-false}
      PADDLEOCR_USE_SEAL_RECOGNITION: ${PADDLEOCR_USE_SEAL_RECOGNITION:-false}
      FASOO_ENABLED: ${FASOO_ENABLED:-false}
      FASOO_BASE_URL: ${FASOO_BASE_URL:-}
      FASOO_API_KEY: ${FASOO_API_KEY:-}
      FASOO_TIMEOUT_SECONDS: ${FASOO_TIMEOUT_SECONDS:-300}
      FASOO_ARTIFACT_WAIT_SECONDS: ${FASOO_ARTIFACT_WAIT_SECONDS:-5}
      FASOO_DETECT_PATH: ${FASOO_DETECT_PATH:-/piiapi/detect/system/path}
      FASOO_CONFIGURATION_PATH: ${FASOO_CONFIGURATION_PATH:-/piiapi/configuration}
      NAS_MOUNT_PATH: ${NAS_MOUNT_PATH:-/app/data/dwp_comp}
      FASOO_NAS_PATH: ${FASOO_NAS_PATH:-/dwp_comp}
      FASOO_WORK_SUBDIR: ${FASOO_WORK_SUBDIR:-parselab}
      FASOO_CA_BUNDLE: ${FASOO_CA_BUNDLE:-}
      FASOO_PATTERNS: ${FASOO_PATTERNS:-}
      FASOO_LABELS: ${FASOO_LABELS:-}
      FASOO_RULE_JSON: ${FASOO_RULE_JSON:-}
      FASOO_MASKING_CHAR: ${FASOO_MASKING_CHAR:-*}
      FASOO_RULE_VERSION: ${FASOO_RULE_VERSION:-1.3}
      FASOO_SYSTEM_CODE: ${FASOO_SYSTEM_CODE:-FASOO}
      FASOO_SYSTEM_NAME: ${FASOO_SYSTEM_NAME:-파수}
      FASOO_INPUT_TYPE: ${FASOO_INPUT_TYPE:-TEXT}
      AUTO_CREATE_TABLES: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - parser_data:/app/data
      - paddleocr_models:/app/models/paddleocr
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

  docling:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:latest}
    profiles: ["parsers"]
    environment:
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cpu}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-parselab-local-docling}
    ports:
      - "${DOCLING_PORT:-15001}:5001"

volumes:
  postgres_data:
  parser_data:
  paddleocr_models:
